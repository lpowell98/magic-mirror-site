name: Deploy to Cloudflare Pages

# main deploys the live site. Any other branch gets its own preview link
# (https://<branch>.magic-mirror-site-gna.pages.dev) and never touches the live site.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write   # to save pages rebuilt from content/events.txt back to the branch

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Event prints: rebuild the gallery, /links, the brochure PDF (and the home page every 4 new events)
      # from content/events.txt, then save the result back to the branch so the repo matches the site.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build event prints
        id: events
        env:
          EVENTS_PDF: skip
        run: |
          pip install --quiet pillow
          python3 scripts/build-events.py
          python3 scripts/build-sitemap.py

      - name: Rebuild brochure PDF
        if: steps.events.outputs.pdf == '1'
        continue-on-error: true   # a PDF problem never blocks the site update
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium
          python3 scripts/build-events.py

      - name: Save rebuilt pages
        run: |
          git add -A public content brochure
          if git diff --cached --quiet; then echo "Nothing to save"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild event prints from content/events.txt"
          git push || echo "Could not save the rebuilt pages (the branch moved). The next push will rebuild them."

      - name: Create Pages project (first run only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages project create magic-mirror-site --production-branch main || true

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy public --project-name magic-mirror-site --branch "${{ github.ref_name }}"

      # Tell Bing (and other IndexNow search engines) the live pages changed.
      # The key file public/c4524209ecb8611b8f0f23fa8546fa1d.txt proves we own the site. Never fails the deploy.
      - name: Notify search engines (IndexNow)
        if: github.ref_name == 'main'
        continue-on-error: true
        run: |
          sleep 30
          URLS=$(grep -o '<loc>[^<]*' public/sitemap.xml | sed 's/<loc>//' | jq -R . | jq -sc .)
          curl -sS -w '\nIndexNow HTTP %{http_code}\n' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"www.magicmirrorrentalservices.com\",\"key\":\"c4524209ecb8611b8f0f23fa8546fa1d\",\"keyLocation\":\"https://www.magicmirrorrentalservices.com/c4524209ecb8611b8f0f23fa8546fa1d.txt\",\"urlList\":$URLS}"
