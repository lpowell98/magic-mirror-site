name: Add Resend email DNS records

on:
  workflow_dispatch:
    inputs:
      dkim:
        description: "Value of the resend._domainkey TXT record shown in Resend (starts with p=)"
        required: true
      region:
        description: "Resend sending region"
        default: us-east-1

jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add records
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RESEND_DKIM: ${{ github.event.inputs.dkim }}
          RESEND_REGION: ${{ github.event.inputs.region }}
        run: bash scripts/resend-dns.sh
